name: Agent organization verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-org-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify records and scope
        run: python3 agent-org/factory/instrumentation/check.py --root agent-org
      - name: Run deterministic behavioral tests
        run: python3 -m unittest discover -s agent-org/factory/tests -v
      - name: Verify whitespace
        run: >-
          git diff --check HEAD^ HEAD -- .
          ':(exclude)agent-org/intake/approved-v0.1/**'
          ':(exclude)agent-org/factory/reports/**/*.diff'
